# 홈서버에서: cd deploy/runner && RUNNER_TOKEN=<토큰> docker compose up -d --build
# 다른 runner와 컨테이너·볼륨 이름이 겹치지 않도록 프로젝트 이름을 고정
name: ebms-runner

services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      RUNNER_URL: ${RUNNER_URL:-https://github.com/alsrjs0725/ebms_server}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-homeserver-ebms}
      RUNNER_LABELS: ${RUNNER_LABELS:-ebms}
    volumes:
      # 호스트 docker로 EBMS 컨테이너를 띄움
      - /var/run/docker.sock:/var/run/docker.sock
      # 단계별 env 파일. 배포 워크플로가 같은 경로로 읽으므로 경로를 그대로 둔다
      - /opt/ebms:/opt/ebms:ro
      # runner 등록 정보와 작업 폴더
      - runner:/actions-runner

volumes:
  runner:
