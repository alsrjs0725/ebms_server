server {
    listen 80;
    listen [::]:80;
    server_name dev.arkfac.live;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.arkfac.live;

    ssl_certificate /etc/letsencrypt/live/dev.arkfac.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.arkfac.live/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FastAPI development reload and future WebSocket endpoints.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
