# EBMS 캐싱 프록시 - Nginx Proxy Manager용 http 블록 설정.
# NPM의 data 볼륨 아래 nginx/custom/http_top.conf로 복사합니다(예: ./data/nginx/custom/http_top.conf). 사이트별 설정은 advanced.conf.
# 내용은 ../nginx/ebms-common.conf.template과 같고, 캐시 위치만 NPM의 /data 볼륨 아래로 둡니다.

# 곡 zip·차트 청크·사전 청크 캐시. 키는 "경로|내용 sha256"이라 내용이 바뀌면 새로 받고, 옛 항목은 inactive 뒤에 지워집니다.
# max_size는 VM 디스크 여유보다 작게 잡습니다.
proxy_cache_path /data/ebms-cache levels=1:2 keys_zone=ebms:64m max_size=20g inactive=30d use_temp_path=off;

# 접속 IP별 제한(DDoS·남용 완화). 다운로드 본문은 캐시에서 나가므로 요청 수만 막습니다.
limit_req_zone  $binary_remote_addr zone=ebms_api:20m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ebms_login:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=ebms_dl:20m    rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ebms_conn:20m;
limit_req_status  429;
limit_conn_status 429;

# 느린 연결로 버티는 공격(slowloris) 완화
client_header_timeout 15s;
client_body_timeout   30s;
send_timeout          60s;
