# EBMS 캐싱 프록시 - Nginx Proxy Manager 로그 보관 기간.
# docker-compose.yml이 이 파일을 컨테이너의 /etc/logrotate.d/nginx-proxy-manager 자리에 읽기 전용으로 붙입니다.
# NPM 백엔드가 이틀마다 logrotate를 돌립니다. 접근·오류 로그에는 접속 IP(오류 로그는 "client:")가 남으므로
# 둘 다 주 단위로 4개만 남깁니다: 지금 파일 + 4주 ≈ 5주, 점검 주기를 더해도 최대 약 6주.
# 바꾸면 개인정보 처리방침의 보유기간도 함께 고칩니다(docs/proxy.md#로그-보관).
# 원본(NPM 기본값): https://github.com/NginxProxyManager/nginx-proxy-manager/blob/develop/docker/rootfs/etc/logrotate.d/nginx-proxy-manager

/data/logs/*_access.log /data/logs/*/access.log {
    su npm npm
    create 0644
    weekly
    rotate 4
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
    kill -USR1 `cat /run/nginx/nginx.pid 2>/dev/null` 2>/dev/null || true
    endscript
}

/data/logs/*_error.log /data/logs/*/error.log {
    su npm npm
    create 0644
    weekly
    rotate 4
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
    kill -USR1 `cat /run/nginx/nginx.pid 2>/dev/null` 2>/dev/null || true
    endscript
}

/data/logs/backend.log {
    su npm npm
    size 10M
    rotate 5
    missingok
    notifempty
    compress
    copytruncate
}
