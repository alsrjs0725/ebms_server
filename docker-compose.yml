services:
  mysql:
    image: mysql:8.4
    # ports를 열지 않음: compose 내부 네트워크에서 ebms 컨테이너만 접근
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ebms}
      MYSQL_USER: ${MYSQL_USER:-ebms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ebms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 압축 파일을 BLOB으로 주고받기 위해 패킷 한도를 키움
      - --max_allowed_packet=1G
      - --innodb_buffer_pool_size=512M
      - --max_connections=200
    volumes:
      # EBMS_MYSQL_DIR에 절대 경로(예: HDD)를 주면 그 폴더에, 비우면 docker 볼륨에 저장
      - ${EBMS_MYSQL_DIR:-mysql-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ebms:
    # 배포된 이미지를 받아 실행. 소스에서 직접 빌드하려면 `docker compose up -d --build`
    image: ${EBMS_IMAGE:-ghcr.io/alsrjs0725/ebms_server:latest}
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      EBMS_DB_HOST: mysql
      EBMS_DB_PORT: 3306
      EBMS_DB_NAME: ${MYSQL_DATABASE:-ebms}
      EBMS_DB_USER: ${MYSQL_USER:-ebms}
      EBMS_DB_PASSWORD: ${MYSQL_PASSWORD:-ebms}
      EBMS_PUBLIC_URL: ${EBMS_PUBLIC_URL:-http://localhost:8000}
      EBMS_SECRET_KEY: ${EBMS_SECRET_KEY:-}
      EBMS_GOOGLE_CLIENT_ID: ${EBMS_GOOGLE_CLIENT_ID:-}
      EBMS_GOOGLE_CLIENT_SECRET: ${EBMS_GOOGLE_CLIENT_SECRET:-}
      EBMS_DISCORD_CLIENT_ID: ${EBMS_DISCORD_CLIENT_ID:-}
      EBMS_DISCORD_CLIENT_SECRET: ${EBMS_DISCORD_CLIENT_SECRET:-}
      EBMS_ADMIN_EMAILS: ${EBMS_ADMIN_EMAILS:-}
      # 다운로드 본문 읽기 스레드 수 한도(API용 스레드와 따로 셈)
      EBMS_DOWNLOAD_THREADS: ${EBMS_DOWNLOAD_THREADS:-16}
      # 프록시 헤더를 믿을 앞단 프록시 주소(쉼표 구분). 호스트의 프록시는 docker 브리지 게이트웨이로 보입니다.
      EBMS_FORWARDED_ALLOW_IPS: ${EBMS_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # S3 호환 스토리지 캐시. EBMS_S3_BUCKET이 비면 꺼짐(.env.example 참고)
      EBMS_S3_ENDPOINT: ${EBMS_S3_ENDPOINT:-}
      EBMS_S3_BUCKET: ${EBMS_S3_BUCKET:-}
      EBMS_S3_ACCESS_KEY_ID: ${EBMS_S3_ACCESS_KEY_ID:-}
      EBMS_S3_SECRET_ACCESS_KEY: ${EBMS_S3_SECRET_ACCESS_KEY:-}
      EBMS_S3_REGION: ${EBMS_S3_REGION:-auto}
      EBMS_S3_CACHE_BYTES: ${EBMS_S3_CACHE_BYTES:-0}
    ports:
      # 평문 HTTP이므로 기본은 호스트의 루프백에만 엽니다. 외부에는 TLS 리버스 프록시(https)로만 공개하세요.
      # 프록시가 docker 컨테이너(nginx-proxy-manager 등)면 루프백에 닿지 못하므로
      # EBMS_BIND_ADDR를 docker 브리지 게이트웨이(예: 172.17.0.1)로 바꿉니다. 0.0.0.0은 쓰지 마세요.
      - "${EBMS_BIND_ADDR:-127.0.0.1}:${EBMS_PORT:-8000}:8000"
    volumes:
      # 로그·임포트 대기 폴더. EBMS_VAR_DIR로 위치 변경
      - ${EBMS_VAR_DIR:-ebms-var}:/app/var

volumes:
  mysql-data:
  ebms-var:
