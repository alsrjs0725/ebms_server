# 컨테이너 stdout 로그(docker logs)의 크기 한도. 기본 json-file 드라이버는 설정이 없으면 무기한 쌓습니다.
# 접속 IP가 담긴 HTTP 접근 로그는 stdout이 아니라 var/log/access.log에 남깁니다(docs/deployment.md#로그-보관).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    # ports를 열지 않음: compose 내부 네트워크에서 ebms 컨테이너만 접근
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ebms}
      MYSQL_USER: ${MYSQL_USER:-ebms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ebms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=512M
      - --max_connections=200
      # 쓰기 로그(binlog·redo log·doublewrite)는 /var/lib/mysql-log에 둡니다. EBMS_MYSQL_LOG_DIR(SSD 등)를 비우면
      # 데이터 폴더를 그 자리에 한 번 더 붙이므로 지금까지와 같은 파일입니다(docs/deployment.md#쓰기-로그를-ssd에-두기).
      - --log-bin=/var/lib/mysql-log/binlog
      # binlog에 바뀐 열만 적어 크기를 줄입니다(기본 FULL은 UPDATE·DELETE마다 행 전체를 적음).
      - --binlog-row-image=MINIMAL
      - --innodb-log-group-home-dir=/var/lib/mysql-log
      - --innodb-doublewrite-dir=/var/lib/mysql-log
    volumes:
      # EBMS_MYSQL_DIR에 절대 경로(예: HDD)를 주면 그 폴더에, 비우면 docker 볼륨에 저장
      - ${EBMS_MYSQL_DIR:-mysql-data}:/var/lib/mysql
      - ${EBMS_MYSQL_LOG_DIR:-${EBMS_MYSQL_DIR:-mysql-data}}:/var/lib/mysql-log
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 비정상 종료 뒤 InnoDB 복구(redo 적용)에 몇 분 걸릴 수 있습니다. 이 시간 안의 실패는 unhealthy로 세지 않습니다(성공하면 바로 healthy).
      start_period: 5m

  ebms:
    # 배포된 이미지를 받아 실행. 소스에서 직접 빌드하려면 `docker compose up -d --build`
    image: ${EBMS_IMAGE:-ghcr.io/alsrjs0725/ebms_server:latest}
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      EBMS_DB_HOST: mysql
      EBMS_DB_PORT: 3306
      EBMS_DB_NAME: ${MYSQL_DATABASE:-ebms}
      EBMS_DB_USER: ${MYSQL_USER:-ebms}
      EBMS_DB_PASSWORD: ${MYSQL_PASSWORD:-ebms}
      EBMS_PUBLIC_URL: ${EBMS_PUBLIC_URL:-http://localhost:8000}
      EBMS_SECRET_KEY: ${EBMS_SECRET_KEY:-}
      EBMS_GOOGLE_CLIENT_ID: ${EBMS_GOOGLE_CLIENT_ID:-}
      EBMS_GOOGLE_CLIENT_SECRET: ${EBMS_GOOGLE_CLIENT_SECRET:-}
      EBMS_DISCORD_CLIENT_ID: ${EBMS_DISCORD_CLIENT_ID:-}
      EBMS_DISCORD_CLIENT_SECRET: ${EBMS_DISCORD_CLIENT_SECRET:-}
      EBMS_ADMIN_USER_IDS: ${EBMS_ADMIN_USER_IDS:-}
      # 프록시 헤더를 믿을 앞단 프록시 주소(쉼표 구분). 호스트의 프록시는 docker 브리지 게이트웨이로 보입니다.
      EBMS_FORWARDED_ALLOW_IPS: ${EBMS_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # 캐싱 리버스 프록시(deploy/proxy)와 나누는 비밀값. 비우면 프록시 연동을 끕니다(docs/proxy.md).
      EBMS_PROXY_SECRET: ${EBMS_PROXY_SECRET:-}
      # 개인정보 보유기간(docs/privacy.md)
      EBMS_RETENTION_SESSION_DAYS: ${EBMS_RETENTION_SESSION_DAYS:-30}
      EBMS_RETENTION_GRANT_DAYS: ${EBMS_RETENTION_GRANT_DAYS:-0}
      EBMS_RETENTION_PRE_USAGE_MONTHS: ${EBMS_RETENTION_PRE_USAGE_MONTHS:-12}
      EBMS_RETENTION_INACTIVE_USER_DAYS: ${EBMS_RETENTION_INACTIVE_USER_DAYS:-0}
      EBMS_RETENTION_INTERVAL_HOURS: ${EBMS_RETENTION_INTERVAL_HOURS:-24}
      # 등록한 난이도표를 다시 읽는 주기(시간). 0이면 관리자 페이지에서 직접(docs/admin.md)
      EBMS_TABLE_REFRESH_HOURS: ${EBMS_TABLE_REFRESH_HOURS:-24}
      # 모든 곡 렌더 색인(중복·섞임 점검, docs/admin.md): 한 번에 몇 분씩, 자동으로 몇 시간마다(0이면 관리자가 직접만).
      EBMS_RENDER_INDEX_HOURS: ${EBMS_RENDER_INDEX_HOURS:-0}
      EBMS_RENDER_INDEX_MINUTES: ${EBMS_RENDER_INDEX_MINUTES:-120}
      # 임포트 캐시(EBMS_CACHE_DIR, SSD 등) 한도. 예: 50G. 0이면 끄고 모두 var에 둡니다(docs/deployment.md)
      EBMS_CACHE_MAX_BYTES: ${EBMS_CACHE_MAX_BYTES:-0}
    ports:
      # 평문 HTTP이므로 기본은 호스트의 루프백에만 엽니다. 외부에는 TLS 리버스 프록시(https)로만 공개하세요.
      # 프록시가 docker 컨테이너(nginx-proxy-manager 등)면 루프백에 닿지 못하므로
      # EBMS_BIND_ADDR를 docker 브리지 게이트웨이(예: 172.17.0.1)로 바꿉니다. 0.0.0.0은 쓰지 마세요.
      - "${EBMS_BIND_ADDR:-127.0.0.1}:${EBMS_PORT:-8000}:8000"
    volumes:
      # 로그·임포트 대기 폴더. EBMS_VAR_DIR로 위치 변경
      - ${EBMS_VAR_DIR:-ebms-var}:/app/var
      # 임포트 중간 작업 공간(업로드·풀어 둔 대기 묶음). EBMS_CACHE_DIR로 빠른 디스크 경로 지정
      - ${EBMS_CACHE_DIR:-ebms-cache}:/app/cache

volumes:
  mysql-data:
  ebms-var:
  ebms-cache:
