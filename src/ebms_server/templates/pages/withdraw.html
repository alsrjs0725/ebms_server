{% extends "auth_base.html" %}

{% block title %}탈퇴 - EBMS{% endblock %}

{% block content %}
<h1 class="h3 mb-3">탈퇴</h1>
<p>{{ ban_text }}</p>
<p>탈퇴하면 계정과 로그인 수단, 로그인된 모든 기기(클라이언트 포함), 티켓·다운로드 사용 기록을 바로 지웁니다. 되돌릴 수 없고, 정지가 끝날 때까지 같은 로그인 수단으로 다시 가입할 수 없습니다.</p>
<form method="post" action="/account/withdraw">
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agree" name="agree" value="1" required>
        <label class="form-check-label" for="agree">되돌릴 수 없다는 것을 확인했습니다.</label>
    </div>
    <a class="btn btn-secondary" href="/login">취소</a>
    <button class="btn btn-danger ms-2" type="submit">탈퇴</button>
</form>
{% endblock %}
