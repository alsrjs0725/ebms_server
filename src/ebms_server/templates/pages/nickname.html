{% extends "auth_base.html" %}

{% block title %}{{ "가입" if signup else "닉네임" }} - EBMS{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{{ "가입" if signup else "닉네임 설정" }}</h1>
{% if signup %}<p>EBMS에서 쓸 닉네임을 정해 주세요. 로그인한 계정의 이름이나 이메일은 가져오지 않습니다.</p>{% endif %}
<form method="post" action="{{ action }}" class="mw-login">
    <label class="form-label" for="nickname">닉네임</label>
    <input class="form-control{% if error %} is-invalid{% endif %}" type="text" id="nickname" name="nickname" value="{{ value }}" maxlength="{{ max_length }}" required autofocus>
    {% if error %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary mt-3" type="submit">{{ "가입" if signup else "저장" }}</button>
</form>
{% endblock %}
