name: Deploy

# release / stage 브랜치에 병합되면 테스트와 이미지 빌드를 나란히 돌리고,
# 테스트가 통과하면 단계 태그를 붙여 홈서버의 self-hosted runner에서 그 이미지로 배포
on:
  push:
    branches: [release, stage]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # rar·7z 임포트·미리듣기 렌더링 테스트용(ci.yml과 같게)
      - run: sudo apt-get update && sudo apt-get install -y unrar 7zip ffmpeg
      - run: uv sync --frozen
      - run: uv run pytest

  # 테스트와 나란히 빌드해 sha 태그로만 올립니다. stage·latest 같은 태그는 테스트가 통과한 뒤 publish에서 붙입니다.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # GHCR 패키지를 저장소와 잇는 OCI 라벨(source 등)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 테스트가 통과한 이미지에만 단계 태그를 붙입니다(다시 빌드하지 않고 manifest만 복사).
  publish:
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=stage,enable=${{ github.ref_name == 'stage' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}
            type=raw,value=release,enable=${{ github.ref_name == 'release' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_name == 'release' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 태그 붙이기
        if: steps.meta.outputs.tags != ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ needs.image.outputs.ref }}
        run: docker buildx imagetools create $(printf -- '-t %s ' $TAGS) "$SOURCE"

  deploy:
    needs: [image, publish]
    runs-on: [self-hosted, ebms]
    permissions:
      contents: read
      packages: read
    env:
      STAGE: ${{ github.ref_name }}
      # 홈서버에서 단계별 env 파일을 두는 폴더 (저장소 변수 EBMS_ENV_DIR로 변경)
      EBMS_ENV_DIR: ${{ vars.EBMS_ENV_DIR || '/opt/ebms' }}
      # 이번 커밋으로 만든 이미지를 그대로 배포
      EBMS_IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: docker compose up
        run: |
          env_file="$EBMS_ENV_DIR/$STAGE.env"
          if [ ! -f "$env_file" ]; then
            echo "::error::$env_file 이 없습니다. docs/deployment.md의 홈서버 세팅을 보세요."
            exit 1
          fi
          compose="docker compose -p ebms-$STAGE --env-file $env_file"
          $compose pull ebms
          # mysql이 복구하느라 늦게 뜨는 경우(healthcheck start_period 5분)까지 기다립니다.
          $compose up -d --no-build --remove-orphans --wait --wait-timeout 600
      - name: 오래된 이미지 정리
        if: always()
        run: docker image prune -f
