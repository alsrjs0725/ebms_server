name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    # 캐시한 .deb가 이 이미지 기준이라 고정합니다(test-tools 캐시 key와 같게).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # rar·7z 임포트·미리듣기 렌더링 테스트용 도구(캐시한 .deb 재사용)
      - uses: ./.github/actions/test-tools
      - run: uv sync --frozen
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/runner
          push: false
